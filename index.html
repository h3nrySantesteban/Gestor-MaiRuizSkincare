<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="msQUl-LfxNNIlzqOg6iG_vGfxrfNZL9FfEXvXEn0krI" />
    <title>Gestor de Turnos — Mai Ruiz Skincare</title>
    <!-- valor por defecto; el script de abajo lo corrige antes del primer
         paint, y useTheme.ts lo mantiene sincronizado con el toggle -->
    <meta name="theme-color" content="#f7f3f1" />
    <script>
      // corre antes del primer paint para no mostrar un flash de tema claro
      // en usuarios que ya eligieron oscuro (una vez que React monta ya es tarde)
      try {
        var t = localStorage.getItem('theme')
        var isDark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        // mismo valor que --color-surface-muted en src/index.css: así la
        // franja de la barra de estado en iOS/Android combina con el fondo
        // de la app en vez de quedarse en blanco cuando el tema es oscuro
        document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#131117' : '#f7f3f1')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
