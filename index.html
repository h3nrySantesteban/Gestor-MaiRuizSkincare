    <script>
      // corre antes del primer paint para no mostrar un flash de tema claro
      // en usuarios que ya eligieron oscuro (una vez que React monta ya es tarde)
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
